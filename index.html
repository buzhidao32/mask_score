<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>放置江湖面具分查询</title>
    <meta
      name="description"
      content="输入面具名、图鉴称号或拼音，实时查询面具图鉴分与组合称号分。"
    />
    <link rel="icon" href="data:," />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("mask-score-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.dataset.theme = theme;
          }
        } catch (error) {}
      })();
    </script>
    <link rel="stylesheet" href="./styles.css?v=20260520-upload-input2" />
  </head>
  <body>
    <button
      id="theme-toggle"
      class="theme-toggle"
      type="button"
      aria-label="切换为黑夜模式"
      aria-pressed="false"
    >
      <span class="theme-toggle-orbit" aria-hidden="true">
        <span class="theme-toggle-glow"></span>
        <span class="theme-toggle-icon theme-toggle-icon-light">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              d="M12 5.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13Zm0-3 1.1 2.1h-2.2L12 2.5Zm0 19 1.1-2.1h-2.2l1.1 2.1ZM4.7 4.7l2.3.7-1.6 1.6-.7-2.3Zm14.6 14.6-.7-2.3-1.6 1.6 2.3.7ZM2.5 12l2.1-1.1v2.2L2.5 12Zm19 0-2.1-1.1v2.2l2.1-1.1ZM4.7 19.3l.7-2.3 1.6 1.6-2.3.7ZM19.3 4.7l-2.3.7 1.6 1.6.7-2.3Z"
            />
          </svg>
        </span>
        <span class="theme-toggle-icon theme-toggle-icon-dark">
          <svg viewBox="0 0 24 24" focusable="false">
            <path
              d="M20.2 15.2A8.2 8.2 0 0 1 8.8 3.8 8.9 8.9 0 1 0 20.2 15.2Z"
            />
          </svg>
        </span>
      </span>
      <span id="theme-toggle-text" class="theme-toggle-text">黑夜</span>
    </button>
    <main class="page">
      <section class="masthead">
        <h1>放置江湖面具分查询</h1>
        <p class="page-links">
          <a href="./inventory.html">打开我的图鉴</a>
          <span class="profile-inline-control">
            <label for="inventory-profile">图鉴档案</label>
            <select id="inventory-profile" class="profile-select">
              <option value="profile-1">档案 1</option>
              <option value="profile-2">档案 2</option>
              <option value="profile-3">档案 3</option>
              <option value="profile-4">档案 4</option>
              <option value="profile-5">档案 5</option>
            </select>
          </span>
        </p>
      </section>

      <section class="search-area" aria-label="查询区域">
        <label class="sr-only" for="query-input">输入内容</label>

        <form id="search-form" class="search-form">
          <div class="input-shell">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path
                  d="M10.5 4a6.5 6.5 0 1 0 4.03 11.6l4.43 4.43 1.06-1.06-4.43-4.43A6.5 6.5 0 0 0 10.5 4Zm0 1.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"
                />
              </svg>
            </span>
            <input
              id="query-input"
              name="query"
              type="search"
              inputmode="search"
              placeholder="例如：嫦娥 / 广寒上仙 / ghsx"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              id="clear-button"
              class="ghost-button"
              type="button"
              hidden
              aria-label="清空输入"
            >
              清空
            </button>
            <button class="primary-button" type="submit">查询</button>
          </div>
        </form>

        <div id="suggestions" class="suggestions" hidden></div>

        <form id="mask-filter-form" class="filter-form" aria-label="面具筛选">
          <div class="form-panel-head">
            <span class="filter-title">面具筛选</span>
            <button
              id="mask-filter-toggle"
              class="collapse-toggle"
              type="button"
              aria-controls="mask-filter-content"
              aria-expanded="true"
            >
              <span class="collapse-toggle-label">收起</span>
              <span class="collapse-toggle-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div id="mask-filter-content" class="filter-content">
            <div class="filter-group" role="group" aria-labelledby="upgrade-filter-title">
              <span id="upgrade-filter-title" class="filter-group-title">升级</span>
              <label class="filter-option">
                <input type="checkbox" name="upgrade-filter" value="upgradable" />
                <span>可升级</span>
              </label>
              <label class="filter-option">
                <input type="checkbox" name="upgrade-filter" value="not-upgradable" />
                <span>不可升级</span>
              </label>
            </div>
            <div class="filter-group" role="group" aria-labelledby="decompose-filter-title">
              <span id="decompose-filter-title" class="filter-group-title">分解</span>
              <label class="filter-option">
                <input type="checkbox" name="decompose-filter" value="decomposable" />
                <span>可分解</span>
              </label>
              <label class="filter-option">
                <input type="checkbox" name="decompose-filter" value="not-decomposable" />
                <span>不可分解</span>
              </label>
            </div>
          </div>
        </form>

        <form id="trait-form" class="trait-form" aria-label="绣女特性加成" hidden>
          <div class="form-panel-head">
            <div class="trait-copy">
              <span class="trait-title">绣女特性</span>
              <span class="trait-limit">最多 3 个</span>
            </div>
            <button
              id="trait-toggle"
              class="collapse-toggle"
              type="button"
              aria-controls="trait-content"
              aria-expanded="true"
            >
              <span class="collapse-toggle-label">收起</span>
              <span class="collapse-toggle-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div id="trait-content" class="trait-content">
            <div id="trait-options" class="trait-options"></div>
            <output id="trait-bonus" class="trait-bonus">总加成 0%</output>
          </div>
        </form>
      </section>

      <section id="status" class="status" aria-live="polite">
        正在加载数据...
      </section>

      <section id="results" class="results" hidden>
        <div id="mask-section" class="result-group" hidden>
          <div class="group-header">
            <h2>面具结果</h2>
            <span id="mask-count" class="pill"></span>
          </div>
          <div id="mask-list" class="card-grid"></div>
        </div>

        <div id="achievement-section" class="result-group" hidden>
          <div class="group-header">
            <h2>称号结果</h2>
            <span id="achievement-count" class="pill"></span>
          </div>
          <div id="achievement-list" class="card-grid"></div>
        </div>
      </section>
    </main>

    <template id="mask-card-template">
      <article class="card">
        <div class="card-top">
          <div class="card-heading">
            <h3 class="card-title"></h3>
            <p class="card-subtitle"></p>
            <p class="alias-line" hidden></p>
            <div class="mask-meta" hidden>
              <details class="upgrade-costs" hidden>
                <summary class="info-chip level-chip"></summary>
                <ul class="upgrade-cost-list"></ul>
              </details>
              <span class="info-chip decompose-chip" hidden></span>
            </div>
          </div>
          <span class="score-badge"></span>
        </div>
        <div class="card-body">
          <div class="detail-block">
            <p class="detail-label">单面具称号</p>
            <p class="direct-line"></p>
          </div>
          <div class="detail-block">
            <p class="detail-label">组合称号</p>
            <ul class="detail-list"></ul>
          </div>
        </div>
      </article>
    </template>

    <template id="achievement-card-template">
      <article class="card">
        <div class="card-top">
          <div class="card-heading">
            <h3 class="card-title"></h3>
            <p class="card-subtitle"></p>
          </div>
          <span class="score-badge"></span>
        </div>
        <div class="card-body">
          <div class="detail-block">
            <p class="detail-label">所需面具</p>
            <ul class="detail-list"></ul>
          </div>
        </div>
      </article>
    </template>

    <script src="./vendor/pinyin-pro.js" defer></script>
    <script src="./app.js?v=20260520-upload-input3" defer></script>
  </body>
</html>
