<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>放置江湖面具分查询</title>
    <meta
      name="description"
      content="输入面具名、图鉴称号或拼音，实时查询面具图鉴分与组合称号分。"
    />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="masthead">
        <h1>放置江湖面具分查询</h1>
        <p class="intro">输入面具名字、称号或拼音，结果会实时显示</p>
      </section>

      <section class="search-area" aria-label="查询区域">
        <label class="sr-only" for="query-input">输入内容</label>

        <form id="search-form" class="search-form">
          <div class="input-shell">
            <span class="input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path
                  d="M10.5 4a6.5 6.5 0 1 0 4.03 11.6l4.43 4.43 1.06-1.06-4.43-4.43A6.5 6.5 0 0 0 10.5 4Zm0 1.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z"
                />
              </svg>
            </span>
            <input
              id="query-input"
              name="query"
              type="search"
              inputmode="search"
              placeholder="例如：嫦娥 / 广寒上仙 / ghsx"
              autocomplete="off"
              spellcheck="false"
            />
            <button
              id="clear-button"
              class="ghost-button"
              type="button"
              hidden
              aria-label="清空输入"
            >
              清空
            </button>
            <button class="primary-button" type="submit">查询</button>
          </div>
        </form>

        <div id="suggestions" class="suggestions" hidden></div>
      </section>

      <section id="status" class="status" aria-live="polite">
        正在加载数据...
      </section>

      <section id="results" class="results" hidden>
        <div id="mask-section" class="result-group" hidden>
          <div class="group-header">
            <h2>面具结果</h2>
            <span id="mask-count" class="pill"></span>
          </div>
          <div id="mask-list" class="card-grid"></div>
        </div>

        <div id="achievement-section" class="result-group" hidden>
          <div class="group-header">
            <h2>称号结果</h2>
            <span id="achievement-count" class="pill"></span>
          </div>
          <div id="achievement-list" class="card-grid"></div>
        </div>
      </section>
    </main>

    <template id="mask-card-template">
      <article class="card">
        <div class="card-top">
          <div class="card-heading">
            <h3 class="card-title"></h3>
            <p class="card-subtitle"></p>
            <p class="alias-line" hidden></p>
          </div>
          <span class="score-badge"></span>
        </div>
        <div class="card-body">
          <div class="detail-block">
            <p class="detail-label">单面具图鉴</p>
            <p class="direct-line"></p>
          </div>
          <div class="detail-block">
            <p class="detail-label">组合称号</p>
            <ul class="detail-list"></ul>
          </div>
        </div>
      </article>
    </template>

    <template id="achievement-card-template">
      <article class="card">
        <div class="card-top">
          <div class="card-heading">
            <h3 class="card-title"></h3>
            <p class="card-subtitle"></p>
          </div>
          <span class="score-badge"></span>
        </div>
        <div class="card-body">
          <div class="detail-block">
            <p class="detail-label">所需面具</p>
            <ul class="detail-list"></ul>
          </div>
        </div>
      </article>
    </template>

    <script src="./vendor/pinyin-pro.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
